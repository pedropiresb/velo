name: Prod Deploy

on:
  workflow_dispatch:
  
env:
  # Versão do Node utilizada em todo o workflow
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECTID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORGID }}
  VERCEL_SCOPE: pedro-pires1
  TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}  

jobs:
  romote-to-Prod:
    name: Prod deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Obter as configurações do vercel
      - name: Pull Vercel Config
        run: yarn vercel pull --yes --environment=production --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE

      # 6. Build para o Vercel
      - name: Build Vercel
        run: yarn vercel build --prod --token=$VERCEL_TOKEN

      # 7. Deploy prod no vercel
      - name: Deploy prod
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT