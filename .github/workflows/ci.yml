
# Workflow para execução exclusiva de testes unitários.
# Estrutura preparada para expansão futura da pipeline de CI.

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{secrets.VERCEL_TOKEN}}
  VERCEL_PROJECTID: ${{secrets.VERCEL_PROJECTID}}
  VERCEL_ORGID: ${{secrets.VERCEL_ORGID}}
  VERCEL_SCOPE: 'pedro-pires1'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Obtém o código-fonte do repositório.
      - name: Checkout
        uses: actions/checkout@v6.1.0

      # Configura a versão do Node.js definida nas variáveis globais.
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para disponibilizar o Yarn.
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências utilizando o yarn.lock.
      - name: Install Dependencies
        run: yarn install --immutable

      # Executa exclusivamente os testes unitários.
      - name: Run Unit Tests
        run: yarn test

  build-and-deploy:
    name: Build and Deploy vercel preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      # Obtém o código-fonte do repositório.
      - name: Checkout
        uses: actions/checkout@v6.1.0

      # Configura a versão do Node.js definida nas variáveis globais.
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para disponibilizar o Yarn.
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências utilizando o yarn.lock.
      - name: Install Dependencies
        run: yarn install --immutable

      # Obter configuracoes do vercel
      - name: Pull vercel config
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      # Build no vercel
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # Deploy no vercel preview
      - name: Deploy Vercel preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN )
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run e2e-tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest

    steps:

      # Obtém o código-fonte do repositório.
      - name: Checkout
        uses: actions/checkout@v6.1.0

      # Configura a versão do Node.js definida nas variáveis globais.
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para disponibilizar o Yarn.
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências utilizando o yarn.lock.
      - name: Install Dependencies
        run: yarn install --immutable

      # Instalacao do chormium
      - name: Install playwright Browser
        run: yarn playwright install --with-deps chromium

      # Run e2e tests
      - name: Run E2E tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}

      # Report of automated tests
      - name: Upload Playwright Report
        if: ${{ !cancelled() }}    
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: test-results    
      

      
